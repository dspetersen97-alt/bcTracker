name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # A real Postgres, because the schema depends on range types and
      # btree_gist exclusion constraints that SQLite cannot emulate.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bctracker
          POSTGRES_USER: bctracker
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bctracker -d bctracker"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      # Must exceed 50 characters or `check --deploy` fails on security.W009.
      DJANGO_SECRET_KEY: ci-secret-key-not-used-for-anything-real-abcdefghijklmnop
      POSTGRES_DB: bctracker
      POSTGRES_USER: bctracker
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # 32 zero bytes, base64. Fine for CI; a real key is generated per install.
      BCTRACKER_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the container base image, so CI tests what ships.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check for missing migrations
        # A model change committed without its migration breaks deploys, and the
        # failure shows up at startup rather than here. Catch it now.
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest -v --no-header

      - name: Deployment checks
        # Verifies the production settings module would not serve in a weak
        # state: missing HSTS, insecure cookies, DEBUG left on.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: counseling.example.org
          DJANGO_CSRF_TRUSTED_ORIGINS: https://counseling.example.org
          SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --fail-level WARNING
