{% load static message_tags %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Counseling records must not be indexed or previewed by anything. #}
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <title>{% block title %}bcTracker{% endblock %}</title>
  {% comment %} External stylesheet, not a <style> block: the Content-Security-Policy in
     compose/caddy/Caddyfile has no 'unsafe-inline', so inline CSS is blocked. {% endcomment %}
  <link rel="stylesheet" href="{% static 'css/bctracker.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {% comment %} The sidebar is collapsed by a checkbox and a sibling CSS selector, with no
     JavaScript at all. Three reasons, in order of weight: the CSP has no
     'unsafe-inline' so a handler would have to be an external file, there is no JS
     build step in this project, and a menu that stops working when a script fails
     is a menu that strands somebody on a page with no way out. The input is
     visually hidden but *focusable* — display:none would take the control away
     from the keyboard entirely — and the <label> gives it its accessible name.

     Unchecked is the expanded state, so the hamburger shows an X: the icon names
     the action on offer, not the state it is in.

     is_signed_in rather than user.is_authenticated, here and at the sidebar below:
     a staff session that has given its password and not its TOTP code is
     authenticated and is going nowhere but the code prompt, so a menu on that page
     is a list of doors that all lead back to it. The answer is made once, in
     apps/accounts/middleware.py, by the same function that does the holding. {% endcomment %}
  {% if is_signed_in %}<input type="checkbox" id="nav-toggle" class="nav-toggle">{% endif %}

  <header class="site-header">
    {% if is_signed_in %}
      <label class="nav-toggle-button" for="nav-toggle" title="Show or hide the menu">
        <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="visually-hidden">Show or hide the menu</span>
      </label>
    {% endif %}
    <a class="brand" href="{% if user.is_authenticated %}{% url 'core:home' %}{% else %}{% url 'accounts:login' %}{% endif %}">bcTracker</a>
    {% comment %} The header holds the brand and the signed-in address, and nothing else.
       Everything that navigates is in the sidebar, including signing out. {% endcomment %}
    {% if user.is_authenticated %}<span class="who">{{ user.email }}</span>{% endif %}
  </header>

  <div class="layout">
    {% if is_signed_in %}
      {% comment %} Navigation is built from the role — see apps/core/navigation.py — and each
         link's page checks the permission again. Hiding a link is a courtesy,
         never the control. {% endcomment %}
      <nav class="sidebar" aria-label="Main">
        <ul class="nav-list">
          <li><a href="{% url 'core:home' %}">Home</a></li>
          {% for link in nav_links %}
            <li>
              <a href="{{ link.url }}">{{ link.label }}{% if link.key == 'messages' and unread_messages %}
                <span class="badge badge-count">{{ unread_messages }}</span>{% endif %}</a>
            </li>
          {% endfor %}
        </ul>
        <ul class="nav-list nav-account">
          <li><a href="{% url 'accounts:home' %}">Your account</a></li>
          <li>
            <form method="post" action="{% url 'accounts:logout' %}">
              {% csrf_token %}
              <button type="submit" class="link-button">Sign out</button>
            </form>
          </li>
        </ul>
      </nav>
    {% endif %}

    <div class="content">
      {% comment %} Back, on every page but Home. A link with a real href rather than a
         script that asks the browser for its history: there is no JavaScript in this
         application, and see apps/core/backlink.py for what that costs and what it is
         worth. Absent rather than disabled when there is nowhere to go back to — a page
         opened from a bookmark has no previous page, and a dead control invites the
         click that proves it is dead.

         Above the messages and outside <main>, because it is not part of what the page
         is about; it is the same furniture as the sidebar. {% endcomment %}
      {% if back_url %}
        <p class="back"><a href="{{ back_url }}" rel="prev"><span aria-hidden="true">&larr;</span> Back</a></p>
      {% endif %}

      {% comment %} A message has two possible homes, and which one it gets depends on
         whether it is allowed to disappear. A confirmation goes to the toast stack in
         the top right corner and fades out by itself, because the page behind it
         already shows what happened. A warning or an error stays here in the flow of
         the page, where it cannot time out from under somebody who has to act on it.
         The rule is in apps/core/templatetags/message_tags.py so that the two
         containers below cannot drift into disagreeing about it.

         Iterating the storage twice is safe: iterating marks it used and leaves the
         loaded list alone, so both filters see everything and the queue is cleared
         once, after the response. {% endcomment %}
      {% with toast_messages=messages|toasts banner_messages=messages|banners %}
        {% if toast_messages %}
          <ul class="toasts" role="status">
            {% for message in toast_messages %}
              <li class="toast toast-{{ message.tags }}">
                <span>{{ message }}</span>
                {% comment %} The checkbox lives inside the toast so that ``:has()`` can
                   hide its own ancestor — there is nothing to remember and nothing to
                   post, so no id, no form and no script. Visually hidden but focusable,
                   which is also what pauses the fade for a keyboard user; a browser
                   without ``:has()`` just waits the fade out instead. {% endcomment %}
                <label class="toast-dismiss">
                  <input type="checkbox" class="visually-hidden">
                  <span aria-hidden="true">&times;</span>
                  <span class="visually-hidden">Dismiss this message</span>
                </label>
              </li>
            {% endfor %}
          </ul>
        {% endif %}

        {% if banner_messages %}
          <ul class="messages" role="status">
            {% for message in banner_messages %}
              <li class="message message-{{ message.tags }}">{{ message }}</li>
            {% endfor %}
          </ul>
        {% endif %}
      {% endwith %}

      {% comment %} main is held to a reading measure by default, because most pages here are
         prose and a form. A page whose content is a table wide enough to need the room
         overrides ``main_class`` with "wide" rather than every page being given the width
         and most of them wasting it. {% endcomment %}
      <main id="main" class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
      </main>

      <footer class="site-footer">
        <p>Confidential. Sessions end automatically after a period of inactivity.</p>
      </footer>
    </div>
  </div>
</body>
</html>
